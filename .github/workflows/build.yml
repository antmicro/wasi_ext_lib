name: build library

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

jobs:
  build-library:
    runs-on: ubuntu-latest
    container:
      image: rust:1.93-slim-trixie
    env:
      DEBIAN_FRONTEND: "noninteractive"
      WASI_SDK_VERSION: "33"
      WASI_SDK_VERSION_FULL: "33.0"
      WASI_SDK_HASH: "0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce"
      WASI_SDK_PATH: "/opt/wasi-sdk"
      CC: "/opt/wasi-sdk/bin/clang"
    steps:
      - name: Install dependencies
        run: |
          apt-get -qqy update > /dev/null
          apt-get -qqy install wget make clang libclang-dev > /dev/null

          WASI_URL="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION_FULL}-x86_64-linux.tar.gz"
          wget -qO /tmp/wasi-sdk.tar.gz "$WASI_URL"
          if [ "$(sha256sum /tmp/wasi-sdk.tar.gz | awk '{print $1}')" != "$WASI_SDK_HASH" ]; then echo "WASI SDK hash mismatch!" && exit 1; fi
          mkdir -p "${WASI_SDK_PATH}"
          tar -xf /tmp/wasi-sdk.tar.gz --strip-components=1 -C "${WASI_SDK_PATH}"

          rustup target add wasm32-wasip1
          rustup target add wasm32-wasip1-threads
          rustup component add rustfmt clippy
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Build
        run: cargo build --target wasm32-wasip1 --release --features hterm
      - name: Build threads
        run: RUSTFLAGS="-C target-feature=-crt-static,+atomics,+bulk-memory,+mutable-globals -C link-arg=--max-memory=4294967296" cargo build --target wasm32-wasip1-threads --release --features hterm
      - name: Run C linter
        run: cd c_lib && ${WASI_SDK_PATH}/bin/clang-tidy --warnings-as-errors='*' *.[ch] -- -I third_party
      - name: Run C formater
        run: cd c_lib && ${WASI_SDK_PATH}/bin/clang-format --style=file --dry-run -Werror *.[ch]
      - name: Run Rust linter
        run: |
          cargo clippy --target wasm32-wasip1 --release -- -Dwarnings
          cargo clippy --target wasm32-wasip1-threads --release -- -Dwarnings
      - name: Run Rust linter with hterm feature
        run: |
          cargo clippy --target wasm32-wasip1 --features hterm --release -- -Dwarnings
          cargo clippy --target wasm32-wasip1-threads --features hterm --release -- -Dwarnings
      - name: Run Rust formater
        run: cargo fmt --check
